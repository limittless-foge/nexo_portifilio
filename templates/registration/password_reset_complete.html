{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete | WISDOM TOWER{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8 bg-[#f4f7f6]">
    <div class="w-full max-w-xl">
        <div class="bg-white rounded-[28px] shadow-[0_20px_60px_rgba(79,70,229,0.08)] border border-slate-200 p-6 sm:p-10 lg:p-12 text-center">
            <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-600 shadow-sm">
                <svg class="h-8 w-8" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12.5 9.5 17 19 7.5"></path>
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-slate-900 sm:text-3xl">Password Reset Successful</h1>
            <p class="mt-3 text-sm leading-6 text-slate-600">
                Your password has been successfully reset. You can now sign in using your new credentials.
            </p>

            <div class="mt-8">
                <a href="{% url 'account_login' %}" class="inline-flex w-full items-center justify-center rounded-2xl bg-[#4f46e5] px-5 py-3.5 text-sm font-semibold text-white shadow-[0_10px_30px_rgba(79,70,229,0.25)] transition hover:bg-indigo-700">
                    Sign In with New Password
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
