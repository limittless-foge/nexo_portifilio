<footer class="bg-slate-950 border-t border-slate-800 py-16 mt-20">

            <a href="{% url 'home' %}" class="flex items-center gap-3 group">
                <img src="{% static 'images/wisdom_tower_logo.png' %}" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" 
                     alt="WISDOM TOWER" 
                     class="h-9 w-auto object-contain transition-transform duration-300 group-hover:scale-105">
                <div class="hidden items-center gap-2 text-white">

                        <rect x="6" y="8" width="4" height="20" fill="currentColor"/>
                        <rect x="14" y="14" width="4" height="14" fill="currentColor"/>
                        <circle cx="16" cy="9" r="2.5" fill="#00C2FF"/>
                    </svg>
                    <span class="text-lg font-black tracking-wider uppercase font-sans">WISDOM <span class="text-slate-400">TOWER</span></span>

            </a>

        <p class="text-slate-400 text-sm max-w-2xl mx-auto mb-8 font-medium leading-relaxed">
            70+ Services. 1 Integrated Partner. From the first draft of your pitch deck to the final line of code on your website, Wisdom Tower provides the architectural framework for your success. Let's Build Together.

        <p class="text-slate-600 text-[10px] uppercase tracking-widest font-black">© 2026 WISDOM TOWER. All rights reserved.</p>
    </div>
</footer>
