{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WISDOM TOWER{% endblock %}</title>
    
    <meta name="description" content="WISDOM TOWER — Comprehensive Service Portfolio. Empowering your ideas with end-to-end digital, creative, and professional solutions.">
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="WISDOM TOWER">
    <meta property="og:description" content="70+ Services. 1 Integrated Partner. Wisdom Tower provides the architectural framework for your success.">
    <meta property="og:image" content="{% static 'images/wisdom_tower_logo.png' %}">
    <meta property="og:type" content="website">

    <!-- Favicon Mark -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22 fill=%22none%22><rect x=%226%22 y=%228%22 width=%224%22 height=%2220%22 fill=%22white%22/><rect x=%2214%22 y=%2214%22 width=%224%22 height=%2214%22 fill=%22white%22/><circle cx=%2216%22 cy=%229%22 r=%222.5%22 fill=%22%2300C2FF%22/></svg>">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/wisdom_tower_logo.png' %}">

    {% block extra_head %}{% endblock %}
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        accent: {
                            50: '#e6faff',
                            100: '#cceeff',
                            200: '#99ddff',
                            300: '#66ccff',
                            400: '#33bbff',
                            500: '#00C2FF',
                            600: '#00a3d9',
                            700: '#0085b3',
                            800: '#00668c',
                            900: '#004866',
                            950: '#00293d',
                        },
                        highlight: {
                            400: '#deff9a',
                        },
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hero-gradient {
            background: linear-gradient(to bottom right, #0f172a, #083344);
        }
        /* Drop-in animation for headings/elements */
        @keyframes dropIn {
            from { transform: translateY(-50px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        .drop-in {
            opacity: 0;
            transform: translateY(-50px);
            animation: dropIn 600ms ease-out forwards;
        }

        /* Combined fall then dance animation */
        @keyframes dropDance {
            0%   { transform: translateY(-80px) rotate(-6deg); opacity: 0; }
            30%  { transform: translateY(0) rotate(0deg); opacity: 1; }
            45%  { transform: translateY(-6px) rotate(3deg); }
            60%  { transform: translateY(4px) rotate(-2deg); }
            80%  { transform: translateY(0) rotate(1deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        /* Perpetual subtle dance */
        @keyframes danceOnly {
            0%   { transform: translateY(0) rotate(0deg); }
            25%  { transform: translateY(-2px) rotate(-1deg); }
            50%  { transform: translateY(1px) rotate(1deg); }
            75%  { transform: translateY(-1px) rotate(-0.5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .fall-dance {
            transform-origin: center;
            display: inline-block;
            animation: dropDance 1.5s cubic-bezier(.2,.9,.2,1) infinite;
        }

        .dance-only {
            display: inline-block;
            animation: danceOnly 3.5s ease-in-out infinite;
        }

        /* Interactive link hover utility */
        .link-interactive {
            transition: transform 180ms ease, color 180ms ease, opacity 180ms ease;
            will-change: transform;
            display: inline-block;
        }
        .link-interactive:hover, .link-interactive:focus {
            transform: translateY(-4px) scale(1.02);
            color: #deff9a; /* highlight */
        }

        /* Letter-by-letter drop and dance */
        @keyframes letterDropAndDance {
            0% { opacity: 0; transform: translateY(-60px) rotate(-15deg); }
            30% { opacity: 1; transform: translateY(0px) rotate(0deg); }
            40% { transform: translateY(-4px) rotate(2deg); }
            50% { transform: translateY(2px) rotate(-2deg); }
            60% { transform: translateY(-4px) rotate(2deg); }
            70% { transform: translateY(2px) rotate(-2deg); }
            80% { transform: translateY(-4px) rotate(2deg); }
            90% { transform: translateY(2px) rotate(-2deg); }
            100% { transform: translateY(0) rotate(0); opacity: 1; }
        }

        .animate-letter {
            display: inline-block;
            will-change: transform, opacity;
            animation-name: letterDropAndDance;
            animation-duration: 1.6s;
            animation-timing-function: cubic-bezier(.2,.9,.2,1);
            animation-iteration-count: infinite;
            animation-fill-mode: both;
        }

        /* Text gradient shift utility */
        .dynamic-color-shift {
            background: linear-gradient(to right, #00C2FF, #14b8a6, #a855f7, #00C2FF);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation: textGradientShift 5s linear infinite;
        }
        @keyframes textGradientShift {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        /* Typewriter / typing reveal */
        .typewriter { display: inline-block; overflow: hidden; white-space: nowrap; border-right: 4px solid rgba(226,232,240,0.2); }
        .animate-typing { width: 0; display: inline-block; animation: typing 3s steps(40,end) forwards, blink 700ms step-end infinite; }
        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { 50% { border-color: transparent; } }

        /* Chevron rotation for sub-service toggle */
        .sub-chevron {
            transition: transform 250ms ease;
        }
        .rotate-90 {
            transform: rotate(90deg);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
    <!-- Navbar -->
    {% include 'header.html' %}

    <main>
        {% if messages %}
            <div class="fixed top-20 right-4 z-[100] space-y-2">
                {% for message in messages %}
                    <div class="glass border-accent/50 px-6 py-3 rounded-xl shadow-2xl animate-bounce text-sm font-medium">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}
    <script>
        
        function toggleDropdown() {
            const menu = document.getElementById('dropdownMenu');
            if (menu) menu.classList.toggle('hidden');
        }
        function toggleAdminDropdown() {
            const menu = document.getElementById('adminMenu');
            if (menu) menu.classList.toggle('hidden');
        }

        // Close dropdowns when clicking outside
        window.onclick = function(event) {
            if (!event.target.closest('#userDropdown')) {
                const menu = document.getElementById('dropdownMenu');
                if (menu && !menu.classList.contains('hidden')) {
                    menu.classList.add('hidden');
                }
            }
            if (!event.target.closest('#adminDropdown')) {
                const menu = document.getElementById('adminMenu');
                if (menu && !menu.classList.contains('hidden')) {
                    menu.classList.add('hidden');
                }
            }
        }
    </script>
</body>
</html>
